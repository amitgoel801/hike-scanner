name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK (pre-installed on GitHub's machines)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Signing key from secrets
        id: key
        env:
          KS_B64: ${{ secrets.KS_B64 }}
        run: |
          if [ -z "$KS_B64" ]; then
            echo "::warning::Secret KS_B64 is missing - building a TEST (debug) APK only"
            echo "have=no" >> "$GITHUB_OUTPUT"
          else
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "have=yes" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release APK
        if: steps.key.outputs.have == 'yes'
        env:
          KS_FILE: ${{ runner.temp }}/release.jks
          KS_PASS: ${{ secrets.KS_PASS }}
          KS_ALIAS: hikescan
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Build test APK (no signing key yet)
        if: steps.key.outputs.have != 'yes'
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Name the APK
        run: |
          V=$(grep -oP "versionName '\K[^']+" app/build.gradle)
          mkdir -p out
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk "out/HikeScan-$V.apk"
          else
            cp app/build/outputs/apk/debug/app-debug.apk "out/HikeScan-$V-TEST.apk"
          fi
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: HikeScan-apk
          path: out/*.apk
          retention-days: 30

      - name: Publish as a GitHub Release (download link)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(grep -oP "versionName '\K[^']+" app/build.gradle)
          C=$(grep -oP "versionCode \K\d+" app/build.gradle)
          F=$(ls out/*.apk)
          if [ "${{ steps.key.outputs.have }}" = "yes" ]; then
            TAG="v$V-build${{ github.run_number }}"
            gh release create "$TAG" "$F" --title "Hike Scan $V (build ${{ github.run_number }})" \
              --notes "Install this APK on the scanner phones. Version $V, code $C." --latest
          else
            TAG="test-build${{ github.run_number }}"
            gh release create "$TAG" "$F" --title "TEST build ${{ github.run_number }} (not for staff)" \
              --notes "Test build without the signing key - for checking only." --prerelease
          fi

      - name: Keep the latest APK on the 'builds' branch
        env:
          TOKEN: ${{ github.token }}
        run: |
          V=$(grep -oP "versionName '\K[^']+" app/build.gradle)
          C=$(grep -oP "versionCode \K\d+" app/build.gradle)
          SIGNED=${{ steps.key.outputs.have }}
          mkdir -p /tmp/b && cp out/*.apk /tmp/b/ && cd /tmp/b
          printf '{"version_code": %s, "version_name": "%s", "signed": "%s", "run": %s, "commit": "%s"}\n' "$C" "$V" "$SIGNED" "${{ github.run_number }}" "${{ github.sha }}" > build.json
          git init -q -b builds
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -q -m "APK build ${{ github.run_number }} ($V, signed=$SIGNED)"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git" builds
