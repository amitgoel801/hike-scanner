plugins {
    id 'com.android.application'
}

android {
    namespace 'com.hikestore.scan'
    compileSdk 34

    defaultConfig {
        applicationId 'com.hikestore.scan'
        minSdk 21            // Android 5.0 and newer (incl. Android 11 / 12 handhelds)
        targetSdk 34
        // keep in step with AppInfo.java
        versionCode 7
        versionName '1.6'
    }

    signingConfigs {
        // TEST builds: one fixed test key in the repo, so a new TEST build installs over the old one
        // (before this, every GitHub build made its own key and the old app had to be uninstalled)
        debug {
            storeFile file('test-debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            // the signing key lives in GitHub secrets (never in the code) - same key for every
            // build, so a new version installs over the old one and keeps the scans on the phone
            storeFile file(System.getenv('KS_FILE') ?: 'missing.jks')
            storePassword System.getenv('KS_PASS') ?: ''
            keyAlias System.getenv('KS_ALIAS') ?: 'hikescan'
            keyPassword System.getenv('KS_PASS') ?: ''
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
